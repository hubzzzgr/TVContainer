name: Build TVContainer Standalone

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receiver-tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test mutual TLS, pairing, streaming, results, and cleanup
        run: bash tests/test_receiver.sh

  download-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test download progress, byte totals, errors, and cancellation
        run: bash tests/test_downloads.sh

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Release
            suffix: ''
            ipa: TVContainer.ipa
          - configuration: Debug
            suffix: '-debug'
            ipa: TVContainer-Debug.ipa
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate standalone tvOS project
        run: bash scripts/generate_project.sh
      - name: Archive Apple TV app
        run: |
          set -o pipefail
          xcodebuild archive -project TVContainer.xcodeproj -scheme TVContainer \
            -destination 'generic/platform=tvOS' -sdk appletvos \
            -archivePath build/TVContainer.xcarchive -configuration '${{ matrix.configuration }}' \
            CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Verify debug isolation and shared app ID
        run: python3 tests/validate_debug_variant.py build/TVContainer.xcarchive/Products/Applications/TVContainer.app '${{ matrix.configuration }}'
      - name: Package standalone IPA
        env:
          ipa_name: ${{ matrix.ipa }}
        run: bash .github/build_github.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TVContainer-tvOS-standalone${{ matrix.suffix }}
          path: build/${{ matrix.ipa }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TVContainer-build-log${{ matrix.suffix }}
          path: build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Debug'
        with:
          name: TVContainer-debug-symbols
          path: build/TVContainer.xcarchive/dSYMs
          if-no-files-found: error

  archive-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test IPA extraction
        run: |
          mkdir -p build
          xcrun clang -fobjc-arc -framework Foundation -larchive \
            tests/extract_harness.m LiveContainerSwiftUI/Utilities/unarchive.m -o build/extract-test
          python3 tests/test_archive.py build/extract-test
          xcrun clang -fobjc-arc -framework Foundation -larchive \
            tests/prepare_archive_harness.m TVContainer/Installer/TVArchive.m \
            LiveContainerSwiftUI/Utilities/unarchive.m -o build/prepare-archive-test
          python3 tests/test_app_archive.py build/prepare-archive-test
          xcrun clang -fobjc-arc -framework Foundation tests/executable_harness.m \
            TVContainer/Installer/TVExecutable.m TVContainer/Installer/TVMachOSlice.m -o build/executable-test
          curl --fail --location --retry 3 'https://github.com/donbytyqi/scenebox/releases/download/v1.0.4/SceneBox-1.0.4-tvOS.ipa' -o build/SceneBox.ipa
          python3 tests/test_executables.py build/executable-test build/SceneBox.ipa
          python3 tests/extract_exec_patcher.py
          xcrun clang -fobjc-arc -fmodules -framework Foundation -ILiveContainer \
            build/exec_patcher.m tests/exec_patch_harness.m -o build/exec-patch-test
          build/exec-patch-test

  bundle-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test main bundle hooks without instruction scanning
        run: bash tests/test_bundle_hooks.sh
      - name: Test local crash capture and release isolation
        run: |
          xcrun clang -fobjc-arc -DDEBUG=1 -framework Foundation \
            tests/crash_logs_harness.m TVContainer/Runtime/TVCrashLogs.m -o build/crash-log-tests
          build/crash-log-tests
          xcrun clang -fobjc-arc -framework Foundation \
            tests/crash_logs_harness.m TVContainer/Runtime/TVCrashLogs.m -o build/crash-log-release-tests
          build/crash-log-release-tests
      - name: Test bundled tweak loading and filters
        run: |
          xcrun clang -dynamiclib tests/tweak_probe.c -o build/TweakProbe.dylib
          xcrun clang -fobjc-arc -framework Foundation tests/tweaks_harness.m \
            TVContainer/Runtime/TVGuestTweaks.m -o build/tweaks-test
          build/tweaks-test "$PWD/build/TweakProbe.dylib"
