name: Build TVContainer Standalone

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate standalone tvOS project
        run: xcodegen generate --spec project.yml
      - name: Archive Apple TV app
        run: |
          set -o pipefail
          xcodebuild archive -project TVContainer.xcodeproj -scheme TVContainer \
            -destination 'generic/platform=tvOS' -sdk appletvos \
            -archivePath build/TVContainer.xcarchive -configuration Release \
            CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Package standalone IPA
        run: bash .github/build_github.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TVContainer-tvOS-standalone
          path: build/TVContainer.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TVContainer-build-log
          path: build.log
          if-no-files-found: ignore

  archive-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test IPA extraction
        run: |
          mkdir -p build
          xcrun clang -fobjc-arc -framework Foundation -larchive \
            tests/extract_harness.m LiveContainerSwiftUI/Utilities/unarchive.m -o build/extract-test
          python3 tests/test_archive.py build/extract-test

  bundle-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test main bundle hooks without instruction scanning
        run: bash tests/test_bundle_hooks.sh
